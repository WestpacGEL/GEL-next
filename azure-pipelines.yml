trigger:
  branches:
    include:
      - main
variables:
  isMain: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
stages:
  - stage: Snyk
    pool:
      vmImage: 'ubuntu-latest'
    variables:
      pnpm_config_cache: $(Pipeline.Workspace)/.pnpm-store
    jobs:
      - job: snyk
        steps:
          - task: UseNode@1.274.1
            inputs:
              version: '22.x'
            displayName: 'Install Node.js'
          - task: Cache@2.274.0
            inputs:
              key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
              path: $(pnpm_config_cache)
            displayName: Cache pnpm

          - task: Bash@3.278.0
            displayName: 'Setup pnpm'
            inputs:
              targetType: inline
              script: |
                corepack enable
                corepack prepare pnpm@10.30.2 --activate
                pnpm config set store-dir $(pnpm_config_cache)

          - task: Bash@3.278.0
            displayName: 'pnpm install'
            inputs:
              targetType: inline
              script: pnpm install --frozen-lockfile
          - task: Bash@3.278.0
            displayName: 'Enable Snyk monitor mode'
            condition: and(succeeded(), eq(variables.isMain, true))
            inputs:
              targetType: inline
              script: |
                echo "##vso[task.setvariable variable=snyk_cmd]monitor"
          - task: Bash@3.278.0
            displayName: 'Enable Snyk test mode'
            condition: and(succeeded(), eq(variables.isMain, false))
            inputs:
              targetType: inline
              script: |
                echo "##vso[task.setvariable variable=snyk_cmd]test"
          - task: CmdLine@2.279.0
            displayName: 'Snyk scan'
            inputs:
              script: |
                docker run --rm \
                  --env SNYK_TOKEN \
                  --volume "$(Build.SourcesDirectory):/app" \
                  --workdir /app \
                  snyk/snyk:node-22 snyk ${SNYK_CMD} --severity-threshold=critical --all-projects --org=${SNYK_ORG_ID} --remote-repo-url=GEL-next --project-tags=applicationid=A00C6A,componenttype=ui,buildnumber=0.0.$(Build.BuildId)
            env:
              SNYK_TOKEN: $(SNYK_TOKEN)
              SNYK_ORG_ID: $(SNYK_ORG_ID)

          - task: CmdLine@2.279.0
            displayName: 'Snyk Code scan'
            inputs:
              script: |
                docker run --rm \
                  --env SNYK_TOKEN \
                  --volume "$(Build.SourcesDirectory):/app" \
                  --workdir /app \
                  snyk/snyk:node-22 snyk code test --severity-threshold=high --org=${SNYK_ORG_ID} --report --project-name=GEL-next --target-reference=$(Build.SourceBranchName) --remote-repo-url=GEL-next --project-tags=applicationid=A00C6A,componenttype=ui,buildnumber=0.0.$(Build.BuildId)
            env:
              SNYK_TOKEN: $(SNYK_TOKEN)
              SNYK_ORG_ID: $(SNYK_ORG_ID)

  - stage: Fortify
    condition: and(succeeded(), eq(variables.isMain, true))
    jobs:
      - job: 'fortify_prepare'
        displayName: 'fortify prepare'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Bash@3.278.0
            displayName: 'Create dist folder'
            inputs:
              targetType: 'inline'
              script: |
                mkdir -p $(Build.SourcesDirectory)/.dist/src 
                mkdir -p $(Build.SourcesDirectory)/.dist/lib && echo '' >> $(Build.SourcesDirectory)/.dist/lib/blank.txt 
                rsync -aF -m $(Build.SourcesDirectory)/ $(Build.SourcesDirectory)/.dist/src/
          - task: ArchiveFiles@2.274.0
            inputs:
              rootFolderOrFile: '$(Build.SourcesDirectory)/.dist'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/source.zip'

          - task: PublishPipelineArtifact@1.242.0
            inputs:
              path: '$(Build.ArtifactStagingDirectory)/source.zip'
              artifactName: drop
      - job: 'fortify_scan'
        displayName: 'fortify scan'
        dependsOn: 'fortify_prepare'
        pool:
          name: 'a00c6a-non-prod-self-hosted'
        steps:
          - checkout: none
          - task: DownloadPipelineArtifact@2.198.0
            inputs:
              source: current
              artifact: drop
              path: '$(Pipeline.Workspace)'
          - task: Bash@3.278.0
            inputs:
              targetType: 'inline'
              script: |
                curl -${JFROG_USER}:${JFROG_TOKEN} -T $(Pipeline.Workspace)/drop/source.zip "${JFROG_URL}/gel-next/0.0.$(Build.BuildId)/source.zip"
            env:
              JFROG_URL: $(JFROG_URL)
              JFROG_USER: $(JFROG_USER)
              JFROG_TOKEN: $(JFROG_TOKEN)
          - task: Bash@3.278.0
            inputs:
              targetType: inline
              script: |
                curl -s -o /dev/null -w "%{http_code}" --request POST --url ${FORTIFY_URL} --header "Authorization: Basic ${FORTIFY_TOKEN}" --header "Content-Type: application/x-www-form-urlencoded" --data "APP_ID=${APP_ID}" --data "COMPONENT=GEL" --data "PJVERID=${FORTIFY_COMPONENT_PJVERID}" --data "EMAIL_ADDRESS=${FORTIFY_EMAIL}" --data "BUILD_LABEL=0.0.$(Build.BuildId)" --data "CODE_LANGUAGE=TypeScript" --data "BRANCH=main" --data "AF_LINK=${JFROG_URL}/gel-next/0.0.$(Build.BuildId)/source.zip"
            env:
              APP_ID: $(APP_ID)
              FORTIFY_URL: $(FORTIFY_URL)
              FORTIFY_TOKEN: $(FORTIFY_TOKEN)
              FORTIFY_COMPONENT_PJVERID: $(FORTIFY_COMPONENT_PJVERID)
              FORTIFY_EMAIL: $(FORTIFY_EMAIL)

  - stage: SyncToBitbucket
    displayName: 'Sync to Bitbucket'
    condition: and(succeeded(), eq(variables.isMain, true))
    jobs:
      - job: sync_to_bitbucket
        displayName: 'Clone and push to Bitbucket'
        pool:
          name: 'a00c6a-non-prod-self-hosted'
        steps:
          - checkout: self
            fetchDepth: 0
          - task: Bash@3.278.0
            env:
              BB_USER: $(BB_USER)
              BB_EMAIL: $(BB_EMAIL)
            displayName: 'Set up Git user'
            inputs:
              targetType: 'inline'
              script: |
                git config user.name "${BB_USER}"
                git config user.email "${BB_EMAIL}"
          - task: Bash@3.278.0
            displayName: 'Push to Bitbucket'
            env:
              BB_USER: $(BB_USER)
              BB_USER_TOKEN: $(BB_USER_TOKEN)
              BB_REPO: $(BB_REPO)
            inputs:
              targetType: 'inline'
              script: |
                git push --set-upstream https://${BB_USER}:${BB_USER_TOKEN}@${BB_REPO} HEAD:refs/heads/GEL-Next-GH --force
