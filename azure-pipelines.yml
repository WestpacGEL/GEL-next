trigger:
  branches:
    include:
      - main
variables:
  isMain: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
  snykTargetReference: $[replace(coalesce(variables['System.PullRequest.SourceBranch'], variables['Build.SourceBranch']), 'refs/heads/', '')]
stages:
  - stage: Snyk
    pool:
      vmImage: 'ubuntu-latest'
    variables:
      pnpm_config_cache: $(Pipeline.Workspace)/.pnpm-store
    jobs:
      - job: snyk
        steps:
          - task: UseNode@1.274.1
            inputs:
              version: '22.x'
            displayName: 'Install Node.js'
          - task: Cache@2.274.0
            inputs:
              key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
              path: $(pnpm_config_cache)
            displayName: Cache pnpm

          - task: Bash@3.278.0
            displayName: 'Setup pnpm'
            inputs:
              targetType: inline
              script: |
                corepack enable
                corepack prepare pnpm@10.30.2 --activate
                pnpm config set store-dir $(pnpm_config_cache)

          - task: Bash@3.278.0
            displayName: 'pnpm install'
            inputs:
              targetType: inline
              script: pnpm install --frozen-lockfile
          - task: Bash@3.278.0
            displayName: 'Enable Snyk monitor mode'
            condition: and(succeeded(), eq(variables.isMain, true))
            inputs:
              targetType: inline
              script: |
                echo "##vso[task.setvariable variable=snyk_cmd]monitor"
          - task: Bash@3.278.0
            displayName: 'Enable Snyk test mode'
            condition: and(succeeded(), eq(variables.isMain, false))
            inputs:
              targetType: inline
              script: |
                echo "##vso[task.setvariable variable=snyk_cmd]test"
          - task: CmdLine@2.279.0
            displayName: 'Snyk scan'
            inputs:
              script: |
                docker run --rm \
                  --env SNYK_TOKEN \
                  --volume "$(Build.SourcesDirectory):/app" \
                  --workdir /app \
                  snyk/snyk:node-22 snyk ${SNYK_CMD} --severity-threshold=critical --all-projects --org=${SNYK_ORG_ID} --remote-repo-url=GEL-next --project-tags=applicationid=A00C6A,componenttype=ui,buildnumber=0.0.$(Build.BuildId)
            env:
              SNYK_TOKEN: $(SNYK_TOKEN)
              SNYK_ORG_ID: $(SNYK_ORG_ID)

          - task: Bash@3.278.0
            displayName: 'Snyk Code scan'
            inputs:
              targetType: inline
              script: |
                snyk_args=(
                  code
                  test
                  --severity-threshold=high
                  "--org=${SNYK_ORG_ID}"
                )

                if [[ "${IS_MAIN}" =~ ^[Tt][Rr][Uu][Ee]$ ]]; then
                  snyk_args+=(
                    --report
                    --project-name=GEL-next
                    --target-name=GEL-next
                    "--target-reference=${SNYK_TARGET_REFERENCE}"
                    --remote-repo-url=https://github.com/WestpacGEL/GEL-next
                    --project-tags=applicationid=A00C6A,componenttype=ui,buildnumber=0.0.$(Build.BuildId)
                  )
                fi

                docker run --rm \
                  --env SNYK_TOKEN \
                  --volume "$(Build.SourcesDirectory):/app" \
                  --workdir /app \
                  snyk/snyk:node-22 snyk "${snyk_args[@]}"
            env:
              IS_MAIN: $(isMain)
              SNYK_TOKEN: $(SNYK_TOKEN)
              SNYK_ORG_ID: $(SNYK_ORG_ID)
              SNYK_TARGET_REFERENCE: $(snykTargetReference)

  - stage: SyncToBitbucket
    displayName: 'Sync to Bitbucket'
    condition: and(succeeded(), eq(variables.isMain, true))
    jobs:
      - job: sync_to_bitbucket
        displayName: 'Clone and push to Bitbucket'
        pool:
          name: 'a00c6a-non-prod-self-hosted'
        steps:
          - checkout: self
            fetchDepth: 0
          - task: Bash@3.278.0
            env:
              BB_USER: $(BB_USER)
              BB_EMAIL: $(BB_EMAIL)
            displayName: 'Set up Git user'
            inputs:
              targetType: 'inline'
              script: |
                git config user.name "${BB_USER}"
                git config user.email "${BB_EMAIL}"
          - task: Bash@3.278.0
            displayName: 'Push to Bitbucket'
            env:
              BB_USER: $(BB_USER)
              BB_USER_TOKEN: $(BB_USER_TOKEN)
              BB_REPO: $(BB_REPO)
            inputs:
              targetType: 'inline'
              script: |
                git push --set-upstream https://${BB_USER}:${BB_USER_TOKEN}@${BB_REPO} HEAD:refs/heads/GEL-Next-GH --force
